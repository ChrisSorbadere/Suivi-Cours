name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-shell/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Numéro de version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Renommage
        id: apk
        run: |
          NOM="Comptes-${{ steps.version.outputs.version }}-b${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nom }}
          path: ${{ steps.apk.outputs.nom }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-b${{ github.run_number }}
          name: Comptes ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.nom }}
          make_latest: true
          body: |
            **Installer sur le téléphone**
            1. Touche le fichier `${{ steps.apk.outputs.nom }}` ci-dessous pour le télécharger.
            2. Ouvre-le, puis autorise l'installation depuis cette source si Android le demande.
            3. Les versions suivantes s'installent par-dessus, sans désinstaller.
